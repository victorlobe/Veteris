syntax = "proto2";

message VersionMsg {
    required string version = 1;
    required string fileName = 2;
    required string minVersion = 3;
    optional uint64 sizeBytes = 4;
    optional string buildVersion = 5;
    optional string platform = 6;
    optional string sourceItem = 7;
    optional string sourceFile = 8;
    optional string sha1 = 9;
    optional string md5 = 10;
    optional string fairplayStatus = 11;
    optional string archFlags = 12;
    optional string backgroundModes = 13;
    optional string executable = 14;
    optional string releaseDate = 15;
    optional string contentRating = 16;
    optional string price = 17;
    optional string subgenres = 18;
    optional string copyrightText = 19;
    optional string gameCenter = 20;
    optional string newsstand = 21;
    optional string requiredCapabilities = 22;
    optional string metadataSource = 23;
    optional string iconPath = 24;
    optional string iconBundleID = 25;
    optional string bundleID = 26;
    optional bool recommended = 27;
}

message InfoBlockMsg {
    required string title = 1;
    required string body = 2;
    repeated InfoFieldMsg fields = 3;
}

message InfoFieldMsg {
    required string label = 1;
    required string value = 2;
}

message AppMsg {
    required string name = 1;
    required string developer = 2;
    required string bundleid = 3;
    required string description = 4;
    repeated VersionMsg versions = 5;
    required string iconurl = 6;
    optional string fallback_iconurl = 7;
    optional string category = 8;
    optional string minIOS = 9;
    optional string deviceFamily = 10;
    optional string archFlags = 11;
    optional string backgroundModes = 12;
    optional string executable = 13;
    optional string releaseDate = 14;
    optional string contentRating = 15;
    optional string price = 16;
    optional string subgenres = 17;
    optional string copyrightText = 18;
    optional string gameCenter = 19;
    optional string newsstand = 20;
    optional string requiredCapabilities = 21;
    optional string primaryBundleID = 22;
    repeated InfoBlockMsg customInfoBlocks = 23;
    optional string websiteURL = 24;
}
